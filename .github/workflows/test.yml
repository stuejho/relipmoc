name: Test

on:
  push:
    branches: [ main ] # Only run on main branch pushes
  pull_request: # Run on all PRs

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-24.04
    env:
      PAGES_ARTIFACTS_PATH: ${{ github.event_name == 'pull_request' && format('site/pr{0}', github.event.number) || '_site' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.15"
          enable-cache: true

      - name: Sync Dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run Tests
        run: >
          uv run pytest
          --cov=src/relipmoc
          --cov-report=html
          --cov-report=markdown-append:$GITHUB_STEP_SUMMARY
          --junitxml=test-results.xml

      - name: Report Test Results
        uses: dorny/test-reporter@v1
        with:
          name: Test Results
          path: test-results.xml
          reporter: java-junit

      - name: Move coverage to directory for artifact upload
        run: |
          mkdir -p ${{ env.PAGES_ARTIFACTS_PATH }}
          mv htmlcov {{ env.PAGES_ARTIFACTS_PATH }}/htmlcov

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Test Result Artifacts for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PAGES_ARTIFACTS_PATH }}
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
